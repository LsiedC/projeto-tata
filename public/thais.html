      <img class="foto-thais" src="../assets/img/foto_thais_moinho.jpeg" data-title="La Nuages"

      <img class="foto-thais" src="../assets/img/foto_thais_c_flor.jpeg" data-title="La fleur"
        data-text="Afortunado dia da sua primeira flor, 24 de Abril de 2026. Alguns dias antes o assunto de flores surgiu nas nossas conversas e tive a oportunidade de saber o seu top 3 flores: Peônia, Margaridas, Rosas, Lírios respectivamente. Sabendo disso, dia 23 tive a ideia bem em cima da hora de fazer essa surpresa porque um dia antes estava com muita cólica e eu senti que precisava de algo para ficar contente. Fui ao mercado, comprei um bis branco porque sabia que você prefere chocolates brancos a pretos. Na manhã do dia 24 acordei atrasado por ter ido dormir tarde, e fui em rumo a escola, no caminho peguei trem, rinite por causa da flor no meu colo e comecei a questionar se realmente você iria gostar. Após chegar onde sempre saio do carro, fui direto para a escola e tive a impressão de estar sendo visto por todos os olhares possíveis mas não me senti intimidado e continuei. Fui direto para as arquibancadas, local planejado para seu encontro e para minha surpresa você já estava lá, inquieta. Me sentei ao seu lado e pedi seu celular para botar uma música, nesse dia desejei que os beneficios do premium fossem pro caralho e eu tivesse botado Careless Whisper no seu fone, não foi possivel e você abriu seus olhos, nesse tive minha resposta.">

      <img class="foto-thais" src="../assets/img/foto_sorriso_inverso.jpeg" data-title="La rencontre amoureuse"
        data-text="O grande dia tinha chegado, e que dia!. Cheguei no mueller duas horas da tarde e fiquei olhando meus livros e quando era lá pelas 14:50 tomei a iniciativa de ir comprar os ingressos, lembro-me que pensei muito em pegar os assentos lá nas ultimas colunas mas não, peguei-os na coluna L, numero 7 e 8. Voltei para a biblioteca porque sabia que estaria lá e a partir daí fomos ver cosméticos onde eu enfiei minha cara nos cremes kkkkkkkkkkkk. Felizmente os cremes tinha cheiro bom e subimos para o segundo andar onde fomos para a loja de brinquedos e nos fascinamos com o chapéu seletor do Harry Potter e logo depois ficamos tão assustados com o preço do bichinho que fomos embora comprar lanches para o grande filme do Michael Jackson que iríamos ver. Compramos um pacote grandão de snikers, um salgadinho picante para esquentar o clima, uma lolo e duas garrafas de agua para nos hidratarmos. Sentamos, rimos, cantamos, xingamos o pai do Michael juntos. E enfim, assim que Michael se acidenta, nos olhamos e foi ai que nosso primeiro beijo aconteceu(to ouvindo hotel california enquanto escrevo e escrevi isso quando veio o dropKKKKKKKKKKKKK (5:38)). Dado os fatos, terminamos o filme sorridentes, alegres, bobos e principalmente de barriga cheia de tanto comer doce. Fomos para a Renner e eu finalmente pude tirar essa foto incrível, eternizando minhas memórias. Comemos Subway depois, rs.">
