<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Site para thaís</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="../style/style.css">
</head>

<body>
  <!-- Início do header -->

  <nav class="navbar navbar-expand-lg">
    <div class="container-fluid">
      <button class="navbar-toggler" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasNavbar"
        aria-controls="offcanvasNavbar" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="offcanvas offcanvas-end" tabindex="-1" id="offcanvasNavbar" aria-labelledby="offcanvasNavbarLabel">
        <div class="offcanvas-body">
          <div id="content-nav" class="d-flex align-items-center ms-auto">
            <ul class="navbar-nav align-items-center pe-3">
              <li class="nav-item titulo-nav">
                <a class="nav-link mx-lg-2 fw-bold" aria-current="page" href="teste_amor.html">Teste do amor</a>
              </li>
              <li class="nav-item titulo-nav">
                <a class="nav-link mx-lg-2" href="musica.html" role="button">Música</a>
              </li>
              <li class="nav-item titulo-nav">
                <a class="nav-link mx-lg-2" href="nos.html" role="button">Nós</a>
              </li>
              <li class="nav-item titulo-nav">
                <a class="nav-link mx-lg-2" href="thais.html" role="button">Thaís</a>
              </li>
              <li class="nav-item timeline titulo-nav">
                <a class="nav-link mx-lg-2" href="timeline.html" role="button">Timeline</a>
              </li>
            </ul>
          </div>
          <div class="content-canudinho">
            <a href="home.html">
              <img id="img-canudinho" src="../Assets/img/foto_canudocaipirinha.jpeg" alt="Imagem sair">
            </a>
          </div>
        </div>
        <div id="linha"></div>
      </div>
    </div>
  </nav>

  <!-- Fim do header -->

  <main>
    <div id="amor">
      <p>Test d'amour</p>
    </div>
    <div id="descricao-amor">
      <p>Digite dois nomes e descubra se eles combinam!</p>
    </div>

    <div id="love-calculator">

      <div class="input-group-love">
        <label>1º NOME:</label>
        <input type="text" id="nome1" placeholder="Digite um nome">
      </div>

      <span id="plus">+</span>

      <div class="input-group-love">
        <label>2º NOME:</label>
        <input type="text" id="nome2" placeholder="Digite outro nome">
      </div>

    </div>
    <div class="btn-container">
      <button id="btn-amor" onclick="calcularAmor()">
        Iniciar teste
      </button>
    </div>
    <div id="resultado-amor">
      <div class="heart-container">
        <div class="heart-bg">❤</div>
        <div id="heart-fill">
          ❤
        </div>
        <div id="percentual">0%</div>
      </div>
      <p id="mensagem-amor"></p>
    </div>

  </main>
  <!-- Scritps -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
  <script src="../scripts/teste-amor.js"></script>
</body>

</html>
