<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Site para thaís</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="../style/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>

  <!-- Início do header -->

  <nav class="navbar navbar-expand-lg">
    <div class="container-fluid">
      <button class="navbar-toggler" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasNavbar"
        aria-controls="offcanvasNavbar" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="offcanvas offcanvas-end" tabindex="-1" id="offcanvasNavbar" aria-labelledby="offcanvasNavbarLabel">
        <div class="offcanvas-body">
          <div id="content-nav" class="d-flex align-items-center ms-auto">
            <ul class="navbar-nav align-items-center pe-3">
              <li class="nav-item titulo-nav">
                <a class="nav-link mx-lg-2" href="teste_amor.html">Teste do amor</a>
              </li>
              <li class="nav-item titulo-nav">
                <a class="nav-link mx-lg-2 fw-bold" href="musica.html" role="button">Música</a>
              </li>
              <li class="nav-item titulo-nav">
                <a class="nav-link mx-lg-2" href="nos.html" role="button">Nós</a>
              </li>
              <li class="nav-item titulo-nav">
                <a class="nav-link mx-lg-2" href="thais.html" role="button">Thaís</a>
              </li>
              <li class="nav-item timeline titulo-nav">
                <a class="nav-link mx-lg-2" href="timeline.html" role="button">Timeline</a>
              </li>
            </ul>
          </div>
          <div class="content-canudinho">
            <a href="home.html">
              <img id="img-canudinho" src="../assets/img/foto_canudocaipirinha.jpeg" alt="Imagem sair">
            </a>
          </div>
        </div>
        <div id="linha"></div>
      </div>
    </div>
  </nav>

  <!-- Fim do header -->
  <main>
    <div id="musicapag">
      <p>Chanson</p>
    </div>
    <div id="descricao-musicapag">
      <p>Sei que músicas são muito especiais para você. Sabendo disso, decidi criar essa página com as músicas que me lembram meu amor por você... Bota um fone, e aproveite essa tracklist</p>
    </div>
    <section id="music-player-page">

      <div class="music-player">

        <div class="top-bar">
          <i id="playlist-open" class="fa-solid fa-bars"></i>
          <i class="fa-solid fa-magnifying-glass"></i>
        </div>

        <div class="cover">

          <div class="cover-glow"></div>

          <img id="cover-img" alt="">

        </div>

        <div class="song-details">
          <h2 id="song-title">Nome da Música</h2>
          <p id="song-artist">Artista</p>
        </div>

        <div class="progress-area">
          <input type="range" id="progress" value="0" min="0" max="100">
        </div>

        <div class="time-info">
          <span id="current-time">0:00</span>
          <span id="duration">0:00</span>
        </div>

        <div class="volume-area">

          <i id="volume-icon" class="fa-solid fa-volume-high"></i>

          <input type="range" id="volume-slider" min="0" max="100" value="100">

        </div>

        <div class="controls">

          <button id="prev">
            <i class="fa-solid fa-backward"></i>
          </button>

          <button id="play">
            <i class="fa-solid fa-play"></i>
          </button>

          <button id="next">
            <i class="fa-solid fa-forward"></i>
          </button>

        </div>
        <div class="playlist">

          <div class="playlist-header">
            <span>Playlist</span>
            <i class="fa-solid fa-chevron-up"></i>
          </div>

          <div id="playlist-content">

          </div>

        </div>

      </div>

      <audio id="audio"></audio>

    </section>
  </main>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
  <script src="../scripts/songs.js"></script>

</body>

</html>
